<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Certificate of Proficiency Verification Result</title>
  
<link rel="icon" type="image/png" href="fav.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="page">
<button class="menu" id="menuBtn" aria-label="Open menu">☰</button>
<button class="close-menu" id="closeBtn" aria-label="Close menu">×</button>
<div class="page-overlay" id="pageOverlay"></div>
  
    <main class="content">
<div class="logo">
  <img src="logo.png" alt=" logo">
</div>
      
      <h1>Certificate of Proficiency Verification Result</h1>

     <a href="search/web/cop.html?cert=016.245063">
  Verify Certificate
</a>
      

    </main>
  </div>




  


<script>
  const menuBtn = document.getElementById("menuBtn");
  const closeBtn = document.getElementById("closeBtn");
  const overlay = document.getElementById("pageOverlay");

  function openMenu() {
    overlay.classList.add("active");
    closeBtn.classList.add("active");

    menuBtn.setAttribute("aria-expanded", "true");
    closeBtn.setAttribute("aria-label", "Close menu");
  }

  function closeMenu() {
    overlay.classList.remove("active");
    closeBtn.classList.remove("active");

    menuBtn.setAttribute("aria-expanded", "false");
  }

  menuBtn.addEventListener("click", openMenu);
  closeBtn.addEventListener("click", closeMenu);
  overlay.addEventListener("click", closeMenu);
</script>


  
</body>
</html>
